<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乔迁之喜 - 诚挚邀请</title>
    <style>
        /* 基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; background: #fdfaf6; color: #4a4a4a; line-height: 1.8; }

        /* 顶部欢迎图/大背景 */
        .hero { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.4)), url('home.jpg') center/cover no-repeat; height: 40vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; }
        .hero h1 { font-size: 2.5rem; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }
        .hero p { font-size: 1.1rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

        /* 主体容器 */
        .container { max-width: 600px; margin: -30px auto 40px; padding: 30px 20px; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(163, 143, 119, 0.15); position: relative; z-index: 10; width: 90%; }

        /* 邀请词 */
        .invitation-text { text-align: center; margin-bottom: 35px; padding-bottom: 25px; border-bottom: 1px dashed #e6dfd5; }
        .invitation-text h2 { color: #c89666; font-size: 1.5rem; margin-bottom: 15px; }
        .invitation-text p { margin-bottom: 8px; font-size: 1.05rem; }

        /* 详情板块（时间和地点） */
        .info-section { background: #fbf9f6; padding: 20px; border-radius: 12px; margin-bottom: 25px; border-left: 4px solid #c89666; }
        .info-title { font-weight: bold; color: #c89666; margin-bottom: 5px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .info-content { font-size: 1.05rem; color: #5a5a5a; }

        /* 按钮样式 */
        .btn { display: block; width: 100%; background: #c89666; color: white; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-size: 1.1rem; border: none; cursor: pointer; transition: background 0.3s; margin-top: 15px; box-shadow: 0 4px 10px rgba(200, 150, 102, 0.3); }
        .btn:hover { background: #b38153; }

        /* 页脚 */
        footer { text-align: center; padding: 20px; color: #aaa; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>WE ARE MOVING</h1>
        <p>诚邀您见证我们的乔迁之喜</p>
    </div>

    <div class="container">
        <div class="invitation-text">
            <h2>良辰吉日 谨呈华翰</h2>
            <p>新居落成，满怀喜悦。</p>
            <p>过去的时光里，感谢有您的陪伴与支持。</p>
            <p>特设薄酒，诚邀您及家人移步新居，</p>
            <p>共叙友情，分享这份乔迁的快乐！</p>
        </div>

        <div class="info-section">
            <div class="info-title">📅 宴请时间</div>
            <div class="info-content"><strong>2026年X月X日（星期X）中午 12:00</strong></div>
        </div>

        <div class="info-section">
            <div class="info-title">📍 新居地址</div>
            <div id="addressText" class="info-content">XX省XX市XX区XX路XX小区XX号楼XX室</div>
            <button class="btn" onclick="copyAddress()">📋 点击复制详细地址</button>
        </div>

        <footer>
            <p>期待您的光临 ✨</p>
        </footer>
    </div>

    <script>
        // 一键复制地址功能
        function copyAddress() {
            var address = document.getElementById("addressText").innerText;
            navigator.clipboard.writeText(address).then(function() {
                alert("地址已复制到剪贴板，快去地图软件导航吧！🚗");
            }, function() {
                alert("复制失败，请手动复制地址。");
            });
        }
    </script>
</body>
</html>
