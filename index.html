<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옌훠치훠궈양꼬치</title>
    <style>
        /* 基础样式复位 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; background: #f4f7f6; }

        /* 导航栏 */
        nav { background: #2c3e50; color: white; padding: 1rem 2rem; position: fixed; width: 100%; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        nav .logo { font-size: 1.5rem; font-weight: bold; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { color: white; text-decoration: none; transition: 0.3s; }
        nav ul li a:hover { color: #3498db; }

        /* 主体内容布局 */
        .container { max-width: 800px; margin: 80px auto 40px; padding: 20px; }

        /* 英雄版块 (Hero Section) */
        header { text-align: center; padding: 60px 20px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #3498db; margin-bottom: 20px; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { color: #666; font-size: 1.1rem; }

        /* 介绍版块 */
        section { margin-top: 30px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { border-left: 5px solid #3498db; padding-left: 15px; margin-bottom: 20px; }

        /* 按钮样式 */
        .btn { display: inline-block; background: #3498db; color: white; padding: 10px 25px; border-radius: 25px; text-decoration: none; margin-top: 20px; transition: background 0.3s; border: none; cursor: pointer; }
        .btn:hover { background: #2980b9; }

        /* 页脚 */
        footer { text-align: center; padding: 20px; color: #888; font-size: 0.9rem; }

        /* 简单动画 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 1s ease-out; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">옌훠치훠궈양꼬치</div>
        <ul>
            <li><a href="#about">한 말씀</a></li>
            <li><a href="#works">메뉴</a></li>
            <li><a href="#contact">연락</a></li>
        </ul>
    </nav>

    <div class="container fade-in">
        <!-- 头部/个人名片 -->
        <header>
            <img src="titelimg.png" alt="头像">
            <h1>안녕하세요,옌훠치훠궈양꼬치</h1>
            <p>저희 식당에 오셔서 식사하시기를 진심으로 초대합니다.</p>
            <button class="btn" onclick="sayHello()">식사 예약</button>
        </header>

        <!-- 关于我 -->
        <section id="about">
            <h2>가게소개</h2>
            <p>店里介绍。。。。。。。</p>
        </section>

        <!-- 作品/项目 -->
        <section id="works">
            <h2>신규메뉴</h2>
            <p>新品菜单</p>
            <ul style="margin-left: 20px; margin-top: 10px;">
                <li>菜单1:。。。。。</li>
                <li>菜单2:。。。。。</li>
            </ul>
        </section>

    </div>

    <script>
        // 简单的交互功能
        function sayHello() {
            alert('👋전화번호:010-6495-1724');
        }
    </script>
</body>
</html>
